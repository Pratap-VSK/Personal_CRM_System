{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
          <h2 class="h4 fw-bold mb-2">Welcome back</h2>
          <p class="text-muted mb-4">Stay organized with your personal relationships and follow-ups.</p>
          <a href="{% url 'crm:contact_list' %}" class="btn btn-primary">View Contacts</a>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 text-center">
          <h5 class="text-muted">Total Contacts</h5>
          <div class="display-5 fw-bold text-primary">{{ total_contacts }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
